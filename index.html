<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生科2601 课表</title>
<meta name="theme-color" content="#080b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课表">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#080b11; --bg2:#0d131c; --card:#161e2a; --card2:#1f2a3a;
  --ink:#edf3fb; --ink2:#9db0c7; --ink3:#5d6f85;
  --line:rgba(255,255,255,.075);
  --accent:#4f8cff; --accent2:#22c6a8; --warn:#f5a524;
  --sheet:rgba(6,10,16,.55);
  --shadow:0 6px 18px rgba(0,0,0,.42);
  --tw:29px; --rh:56px;
}
[data-theme="light"]{
  --bg:#eef2f7; --bg2:#ffffff; --card:#ffffff; --card2:#eef3fa;
  --ink:#0f172a; --ink2:#5c6b80; --ink3:#93a1b3;
  --line:rgba(15,23,42,.10);
  --accent:#2f6bff; --accent2:#0e9f86; --warn:#b45309;
  --sheet:rgba(15,23,42,.32);
  --shadow:0 6px 18px rgba(15,23,42,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 480px at 88% -6%, rgba(64,124,255,.20), transparent 62%),
    radial-gradient(760px 460px at 4% 4%, rgba(34,198,168,.13), transparent 58%),
    radial-gradient(700px 500px at 60% 108%, rgba(120,80,255,.14), transparent 60%);
  background-attachment:fixed;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  min-height:100vh;
}
[data-theme="light"] body{background-image:none}
@media (min-width:620px){
  header,.strip,.grid,#page{max-width:620px;margin-left:auto;margin-right:auto}
}

/* ---------- 顶部 ---------- */
header{
  position:sticky; top:0; z-index:30;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:saturate(160%) blur(18px); -webkit-backdrop-filter:saturate(160%) blur(18px);
}
.top{display:flex;align-items:center;gap:6px}
.wnum{font-size:24px;font-weight:800;letter-spacing:.4px;line-height:1.1;white-space:nowrap}
.wnum em{font-style:normal;color:var(--accent)}
.wdate{font-size:11px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.iconbtn{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none
}
.iconbtn:active{background:var(--card2)}
.iconbtn.add{background:var(--accent);border-color:var(--accent);color:#fff;font-size:19px;font-weight:600}
.nextline{
  margin-top:6px;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.nextline b{color:var(--ink);font-weight:600}
.nextline .cd{color:var(--accent2);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);flex:none}

/* ---------- 星期条 ---------- */
.strip{
  display:grid;grid-template-columns:var(--tw) repeat(7,1fr);
  padding:5px 6px 2px;touch-action:pan-y;
}
.strip .d{text-align:center;font-size:9.5px;color:var(--ink3);padding:3px 0 4px;border-radius:8px}
.strip .d b{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
.strip .d.we{color:var(--ink3)}
.strip .d.today{background:var(--accent);color:#eaf2ff}
.strip .d.today b{color:#fff}

/* ---------- 网格 ---------- */
.grid{
  display:grid;
  grid-template-columns:var(--tw) repeat(7,1fr);
  grid-template-rows:repeat(10,var(--rh));
  padding:0 6px 12px;
  position:relative;touch-action:pan-y;
}
.grid.anim-l{animation:slideL .22s ease}
.grid.anim-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(16%);opacity:.35}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-16%);opacity:.35}to{transform:none;opacity:1}}
.tm{grid-column:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;color:var(--ink3)}
.tm i{font-style:normal;font-size:10px;font-weight:700;color:var(--ink2);line-height:1}
.tm span{font-size:7px;line-height:1.35;margin-top:2px;opacity:.85}
.lines{
  grid-column:2 / 9;grid-row:1 / 11;pointer-events:none;
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:calc(100% / 7) 100%, 100% var(--rh);
  border-right:1px solid var(--line);
}
.colhl{grid-row:1 / 11;background:rgba(79,140,255,.09);border-radius:9px;pointer-events:none}
.colhl.we{background:rgba(255,255,255,.028)}
[data-theme="light"] .colhl{background:rgba(47,107,255,.06)}

.blk{
  position:relative;margin:2px 1.5px;border-radius:10px;padding:5px 4px;
  background:var(--c);color:#fff;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.30);
  transition:transform .12s ease;
}
.blk:active{transform:scale(.96)}
.blk .bn{font-size:11px;font-weight:700;line-height:1.2;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.blk .br{font-size:8.5px;line-height:1.25;margin-top:auto;opacity:.96;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.blk .bdot{position:absolute;right:4px;top:4px;width:3.5px;height:3.5px;border-radius:50%;background:rgba(255,255,255,.9)}
.blk.past{filter:saturate(.5) brightness(.8)}
.blk.live{box-shadow:inset 0 0 0 2px #fff, 0 6px 16px rgba(0,0,0,.45)}
/* 自定义日程 */
.blk.ev{
  background:transparent;color:var(--ink);
  border:1.6px dashed var(--warn);
  box-shadow:none;z-index:3;
}
.blk.ev .bn{text-shadow:none;color:var(--warn)}
.blk.ev .br{text-shadow:none;color:var(--ink2)}
.blk.ev .bdot{background:var(--warn)}
.blk.ev.ovl{margin-left:38%;background:var(--bg2);backdrop-filter:blur(4px)}

/* ---------- 底部导航 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;
  padding:7px 14px calc(7px + env(safe-area-inset-bottom));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  border-top:1px solid var(--line);
}
nav button{
  flex:1;max-width:160px;border:0;background:transparent;color:var(--ink3);
  font-size:10.5px;font-family:inherit;padding:4px 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px
}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--accent)}

/* ---------- 列表视图 ---------- */
.page{padding:4px 12px 20px}
.dayhd{display:flex;align-items:baseline;gap:8px;margin:14px 2px 8px;font-size:11.5px;color:var(--ink2)}
.dayhd b{font-size:15px;color:var(--ink);font-weight:700}
.dayhd .rest{margin-left:auto;color:var(--ink3)}
.card{
  position:relative;display:flex;gap:12px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card.past{opacity:.55}
.card.live{border-color:var(--c)}
.card.ev{border-style:dashed;border-color:var(--warn)}
.card.ev::before{background:var(--warn)}
.time{flex:none;width:70px;font-variant-numeric:tabular-nums}
.time .s{font-size:16px;font-weight:700}
.time .e{font-size:11px;color:var(--ink3);margin-top:1px}
.time .p{font-size:10px;color:var(--ink3);margin-top:5px}
.body{flex:1;min-width:0}
.name{font-size:16px;font-weight:700;line-height:1.3}
.room{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--c)}
.room.und{color:#ffa14a}
.room svg{width:14px;height:14px;flex:none}
.meta{margin-top:4px;font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{position:absolute;right:12px;top:12px;font-size:10px;font-weight:700;color:#fff;background:var(--c);padding:2px 7px;border-radius:999px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}
.empty b{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}

.item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.sw{width:7px;height:7px;border-radius:2px;flex:none;background:var(--c)}
.item .n{font-size:14.5px;font-weight:600}
.item .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.item .sub em{font-style:normal;color:var(--ink3)}
.del{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink3);border-radius:9px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.sec{margin:16px 2px 8px;font-size:11px;color:var(--ink3);letter-spacing:.4px}

/* ---------- 弹层 ---------- */
.sheetwrap{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:var(--sheet);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheetwrap.on{display:flex}
.sheet{
  width:100%;max-width:620px;margin:0 auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);animation:up .22s ease;max-height:88vh;overflow:auto
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:19px}
.sheet .sroom{margin-top:8px;font-size:15px;font-weight:600;color:var(--accent2);display:flex;align-items:center;gap:6px}
.sheet .sroom svg{width:16px;height:16px}
.sheet dl{display:grid;grid-template-columns:56px 1fr;gap:9px 12px;margin:16px 0 18px;font-size:13.5px}
.sheet dt{color:var(--ink3)}
.sheet dd{margin:0;color:var(--ink);line-height:1.5}
.sheet button{width:100%;padding:13px;border-radius:13px;border:0;background:var(--card2);color:var(--ink);font-size:15px;font-family:inherit;font-weight:600;cursor:pointer}
.sheet button.warn{background:transparent;border:1px solid rgba(245,165,36,.5);color:var(--warn);margin-top:8px}

.fld{margin-top:14px}
.fld > label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.fld input{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;color:var(--ink);font-size:15px;font-family:inherit;outline:none
}
.fld input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{
  width:auto;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink2);font-size:12.5px;font-weight:500
}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.selrow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.selrow select{
  flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:10px 8px;color:var(--ink);font-size:14px;font-family:inherit;outline:none;appearance:none;text-align:center
}
.hint2{margin-top:10px;font-size:11.5px;color:var(--warn);line-height:1.5;display:none}
.hint2.on{display:block}
.banner{margin:14px 2px 0;padding:11px 13px;border-radius:13px;background:rgba(79,140,255,.14);color:#b9d0ff;font-size:12.5px;line-height:1.55}
[data-theme="light"] .banner{background:#e8f0ff;color:#2b58b8}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="wnum">第 <em>8</em> 周</div>
      <div class="wdate">10/26 – 11/01</div>
    </div>
    <div class="grow"></div>
    <button class="iconbtn" id="pw" aria-label="上一周">‹</button>
    <button class="iconbtn" id="nw" aria-label="下一周">›</button>
    <button class="iconbtn add" id="btnadd" aria-label="添加日程">＋</button>
    <button class="iconbtn" id="themebtn" aria-label="切换主题">☾</button>
  </div>
  <div class="nextline" id="nextline"></div>
</header>

<div class="strip" id="strip"></div>
<div class="grid" id="grid"></div>
<div id="page"></div>

<nav>
  <button data-tab="grid" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>
    课程表
  </button>
  <button data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    今天
  </button>
  <button data-tab="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    课程
  </button>
</nav>

<div class="sheetwrap" id="sheetwrap">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============ 数据：来自《生科2601班级课表.xls》 ============ */
const W1 = new Date(2026, 8, 7);   // 第1周 周一
const SEM_WEEKS = 20;

const PERIODS = [
  {p:"1-2",  s:"08:00", e:"09:40", sub:[["08:00","08:45"],["08:55","09:40"]]},
  {p:"3-4",  s:"10:00", e:"11:40", sub:[["10:00","10:45"],["10:55","11:40"]]},
  {p:"5-6",  s:"14:00", e:"15:40", sub:[["14:00","14:45"],["14:55","15:40"]]},
  {p:"7-8",  s:"16:00", e:"17:40", sub:[["16:00","16:45"],["16:55","17:40"]]},
  {p:"9-10", s:"19:00", e:"20:40", sub:[["19:00","19:45"],["19:55","20:40"]]}
];

const COURSES = [
  {n:"习概",        full:"习近平新时代中国特色社会主义思想概论", t:"贺才乐", room:"A座119",       d:1, p:0, w:"2-4,8-20", alt:1, c:"#3f7dfb"},
  {n:"高数C2",      full:"高等数学C2",                        t:"张佃中", room:"B座413",       d:1, p:1, w:"2-4,8-20", alt:1, c:"#7b5cf5"},
  {n:"体育（一）",   full:"体育（一）",                          t:"杨志宏", room:"地点待定",     d:1, p:3, w:"2-4,8-20", alt:0, c:"#23a06a"},
  {n:"高数C2",      full:"高等数学C2",                        t:"张佃中", room:"B座413",       d:2, p:2, w:"2-4,8-20", alt:0, c:"#7b5cf5"},
  {n:"新生课",      full:"新生课",                            t:"刘静 等", room:"B座110",     d:2, p:3, w:"2-4,9-13", alt:0, c:"#c2457e"},
  {n:"大学英语（一）", full:"大学英语（一）",                    t:"胡良骥", room:"外语网络楼347", d:3, p:0, w:"2-4,8-20", alt:0, c:"#17958e"},
  {n:"基础化学",    full:"基础化学",                          t:"邓留",   room:"B座311",       d:3, p:1, w:"2-4,9-19", alt:0, c:"#e05070"},
  {n:"心理健康（一）", full:"大学生心理健康教育（一）",            t:"傅建平", room:"C座408",       d:3, p:4, w:"10-17",    alt:2, c:"#2587c9"},
  {n:"基础化学",    full:"基础化学",                          t:"邓留",   room:"A座201",       d:4, p:1, w:"2-4,9-19", alt:0, c:"#e05070"},
  {n:"习概",        full:"习近平新时代中国特色社会主义思想概论", t:"贺才乐", room:"C座502",       d:4, p:3, w:"2-4,8-20", alt:0, c:"#3f7dfb"},
  {n:"国家安全教育", full:"国家安全教育",                        t:"晏湘涛", room:"C座205",       d:5, p:0, w:"15-20",    alt:0, c:"#d1852a"},
  {n:"高数C2",      full:"高等数学C2",                        t:"张佃中", room:"B座413",       d:5, p:1, w:"2-4,8-20", alt:0, c:"#7b5cf5"},
  {n:"基础化学实验", full:"基础化学实验",                        t:"肖旭贤", room:"地点待定",     d:5, p:2, w:"3-4,9-18", alt:0, c:"#e2683c", span:2}
];

/* ============ 工具 ============ */
const DAYN = ["周日","周一","周二","周三","周四","周五","周六"];
const MS = 86400000;
const d0 = x => { const d = new Date(x); d.setHours(0,0,0,0); return d; };
const today = () => d0(new Date());
const pad = n => String(n).padStart(2,"0");
const md = d => (d.getMonth()+1) + "/" + pad(d.getDate());
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function weekOf(date){ return Math.floor((d0(date) - d0(W1)) / (7*MS)) + 1; }
function weekMonday(n){ const d = new Date(W1); d.setDate(d.getDate() + (n-1)*7); return d; }
function expand(spec){
  const out = [];
  spec.split(",").forEach(part => {
    const [a,b] = part.split("-").map(Number);
    if (b === undefined) out.push(a); else for (let i=a;i<=b;i++) out.push(i);
  });
  return out;
}
const WC = new Map();
function weeksOf(c){
  const k = c.n + c.d + c.p;
  if (WC.has(k)) return WC.get(k);
  let ws = expand(c.w);
  if (c.alt === 1) ws = ws.filter(w => w % 2 === 0);
  if (c.alt === 2) ws = ws.filter(w => w % 2 === 1);
  WC.set(k, ws); return ws;
}
function coursesOn(date){
  const wk = weekOf(date), di = new Date(date).getDay();
  const dn = di === 0 ? 7 : di;
  return COURSES.filter(c => c.d === dn && weeksOf(c).includes(wk)).sort((a,b) => a.p - b.p);
}
function span(c){
  const a = PERIODS[c.p], b = PERIODS[c.p + (c.span||1) - 1];
  if (!c.span || c.span === 1) return {s:a.s, e:b.e, p:a.p};
  return {s:a.s, e:b.e, p:a.p.split("-")[0] + "-" + b.p.split("-")[1]};
}
function toDate(hm, base){
  const [h,m] = hm.split(":").map(Number);
  const d = new Date(base); d.setHours(h,m,0,0); return d;
}
function weeksText(c){
  let t = "第 " + c.w.replace(/,/g,"、").replace(/-/g,"–") + " 周";
  if (c.alt === 1) t += "（双周）";
  if (c.alt === 2) t += "（单周）";
  return t;
}

/* ============ 自定义日程（存本地） ============ */
const EV_KEY = "kb_events_v1";
let EVENTS = [];
try { EVENTS = JSON.parse(localStorage.getItem(EV_KEY) || "[]") || []; } catch(e){ EVENTS = []; }
function saveEvents(){ try { localStorage.setItem(EV_KEY, JSON.stringify(EVENTS)); } catch(e){} }

/* 某个日期上有哪些日程 */
function eventsOn(date){
  const wk = weekOf(date), di = new Date(date).getDay();
  const dn = di === 0 ? 7 : di;
  return EVENTS.filter(ev => ev.d === dn && (ev.repeat === "weekly" || ev.week === wk))
               .sort((a,b) => a.from - b.from);
}
/* 小节号(1..10) -> 时间 */
function slotTime(n){ return PERIODS[Math.floor((n-1)/2)].sub[(n-1)%2]; }
function evTime(ev){
  const a = slotTime(ev.from), b = slotTime(ev.to);
  return {s:a[0], e:b[1], p: ev.from === ev.to ? String(ev.from) : ev.from + "-" + ev.to};
}

/* ============ 状态 ============ */
let TAB = "grid";
let WK = weekOf(today());
let SEL_DAY = new Date().getDay() || 7;
let SEL_FROM = 1, SEL_TO = 2, SEL_REP = "once";
const THEME_KEY = "kb_theme";
const STANDALONE = window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

/* ============ 主题 ============ */
(function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const b = document.getElementById("themebtn");
  if (b) b.textContent = dark ? "☾" : "☀";
})();
document.getElementById("themebtn").onclick = function(){
  const isDark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = isDark ? "light" : "dark";
  localStorage.setItem(THEME_KEY, isDark ? "light" : "dark");
  this.textContent = isDark ? "☀" : "☾";
  const mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.content = isDark ? "#eef2f7" : "#080b11";
};

/* ============ 顶栏 ============ */
const elW = document.querySelector(".wnum");
const elD = document.querySelector(".wdate");
const elN = document.getElementById("nextline");

function nextClass(){
  const from = today();
  for (let i=0;i<21;i++){
    const d = new Date(from); d.setDate(d.getDate()+i);
    for (const c of coursesOn(d)){
      const sp = span(c), start = toDate(sp.s, d);
      if (start > new Date()) return {c, d, start, sp};
    }
  }
  return null;
}
function renderHead(){
  const mon = weekMonday(WK), sun = new Date(mon); sun.setDate(mon.getDate()+6);
  elW.innerHTML = '第 <em>' + WK + '</em> 周';
  elD.textContent = md(mon) + " – " + md(sun);
  const nx = nextClass();
  if (!nx){ elN.innerHTML = '<span class="dot" style="background:var(--ink3)"></span>近期没有课'; return; }
  const mins = Math.round((nx.start - new Date())/60000);
  const sameDay = d0(nx.d).getTime() === today().getTime();
  const gap = Math.round((d0(nx.d) - today())/MS);
  const when = sameDay ? "" : (gap === 1 ? "明天 " : md(nx.d) + " ");
  const tail = sameDay
    ? '<span class="cd">' + (mins <= 60 ? mins + " 分钟后" : Math.floor(mins/60) + " 小时 " + (mins%60) + " 分后") + '</span>'
    : "";
  elN.innerHTML = '<span class="dot"></span>' + when +
    "<b>" + nx.sp.s + " " + esc(nx.c.n) + "</b> · " + esc(nx.c.room) + " " + tail;
}

/* ============ 网格视图 ============ */
function renderGrid(){
  const t = today(), tw = weekOf(t);
  const mon = weekMonday(WK);
  const todayCol = (WK === tw) ? new Date(t).getDay() : -1;   // 0=周日

  let strip = "<span></span>";
  for (let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const isT = (WK === tw) && d.getTime() === t.getTime();
    strip += '<div class="d ' + (isT ? "today" : "") + '">' + DAYN[d.getDay()] +
             "<b>" + d.getDate() + "</b></div>";
  }
  document.getElementById("strip").innerHTML = strip;

  let g = '<div class="lines"></div>';
  if (todayCol >= 0 && todayCol <= 6)
    g += '<div class="colhl" style="grid-column:' + (todayCol + 2) + '"></div>';

  for (let r=0;r<10;r++){
    const per = PERIODS[Math.floor(r/2)].sub[r%2];
    g += '<div class="tm" style="grid-row:' + (r+1) + '"><i>' + (r+1) + "</i><span>" +
         per[0] + "</span><span>" + per[1] + "</span></div>";
  }

  window.__blocks = {};
  let bid = 0;
  for (let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const dayCourses = coursesOn(d);
    const dayEvents = eventsOn(d);

    for (const c of dayCourses){
      const sp = span(c);
      const s = toDate(sp.s, d), e = toDate(sp.e, d), now = new Date();
      const isToday = (WK === tw) && d.getTime() === t.getTime();
      const live = isToday && now >= s && now <= e;
      const past = isToday && now > e;
      const id = "b" + (bid++);
      window.__blocks[id] = {kind:"course", c:c, d:d, sp:sp};
      g += '<div class="blk ' + (live?"live":"") + " " + (past?"past":"") + '" data-id="' + id +
           '" style="--c:' + c.c + ";grid-column:" + (i+2) + ";grid-row:" + (c.p*2+1) +
           " / span " + (2*(c.span||1)) + '">' +
           '<span class="bdot"></span><div class="bn">' + esc(c.n) + '</div>' +
           '<div class="br">' + esc(c.room) + "</div></div>";
    }

    for (const ev of dayEvents){
      const et = evTime(ev);
      const id = "b" + (bid++);
      const overlap = dayCourses.some(c => {
        const cs = c.p*2+1, ce = cs + 2*(c.span||1) - 1;
        return !(ev.to < cs || ev.from > ce);
      });
      window.__blocks[id] = {kind:"event", ev:ev, d:d, sp:et};
      g += '<div class="blk ev ' + (overlap?"ovl":"") + '" data-id="' + id +
           '" style="grid-column:' + (i+2) + ";grid-row:" + ev.from + " / span " + (ev.to-ev.from+1) + '">' +
           '<span class="bdot"></span><div class="bn">' + esc(ev.n) + '</div>' +
           (ev.room ? '<div class="br">' + esc(ev.room) + "</div>" : "") + "</div>";
    }
  }
  document.getElementById("grid").innerHTML = g;
  document.getElementById("grid").style.display = "grid";
  document.getElementById("strip").style.display = "grid";
  document.getElementById("page").innerHTML = "";
}

/* ============ 今天视图 ============ */
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';

function cardHTML(c, date){
  const sp = span(c), s = toDate(sp.s, date), e = toDate(sp.e, date), now = new Date();
  const past = now > e, live = now >= s && now <= e;
  const und = c.room.indexOf("待定") >= 0;
  const tag = c.alt === 1 ? '<span class="lv" style="background:var(--card2);color:var(--ink2)">双周</span>' : "";
  return '<div class="card ' + (past?"past":"") + " " + (live?"live":"") + '" style="--c:' + c.c + '">' +
    (live ? '<span class="lv">上课中</span>' : "") +
    '<div class="time"><div class="s">' + sp.s + '</div><div class="e">' + sp.e +
      '</div><div class="p">' + sp.p + ' 节</div></div>' +
    '<div class="body"><div class="name">' + esc(c.n) + tag + '</div>' +
      '<div class="room ' + (und?"und":"") + '">' + ICON_PIN + esc(c.room) + '</div>' +
      '<div class="meta">' + esc(c.t) + " · " + esc(c.full) + "</div></div></div>";
}
function evCardHTML(ev, date){
  const et = evTime(ev);
  return '<div class="card ev" style="--c:var(--warn)">' +
    '<div class="time"><div class="s">' + et.s + '</div><div class="e">' + et.e +
      '</div><div class="p">' + et.p + ' 节</div></div>' +
    '<div class="body"><div class="name">' + esc(ev.n) +
      '<span class="lv" style="background:var(--warn)">日程</span></div>' +
      (ev.room ? '<div class="room" style="color:var(--warn)">' + ICON_PIN + esc(ev.room) + '</div>' : "") +
      '<div class="meta">' + (ev.repeat === "weekly" ? "每周重复" : "仅第 " + ev.week + " 周") + "</div></div></div>";
}

function renderToday(){
  const t = today(), list = coursesOn(t), evs = eventsOn(t), wk = weekOf(t);
  let h = "";
  if (!list.length && !evs.length){
    const why = wk > SEM_WEEKS ? "本学期课程已结束" : (wk >= 5 && wk <= 7 ? "军训期间，常规课暂停" : "好好休息");
    h += '<div class="empty" style="margin-top:14px"><b>今天没有课</b>' + why + "</div>";
    const nx = nextClass();
    if (nx){
      const gap = Math.round((d0(nx.d) - t)/MS);
      h += '<div class="sec">' + (gap === 1 ? "明天" : "近几天") + "</div>" +
           '<div class="dayhd"><b>' + DAYN[nx.d.getDay()] + "</b><span>" + md(nx.d) + "</span></div>" +
           cardHTML(nx.c, nx.d);
    }
  } else {
    h += '<div class="dayhd"><b>' + DAYN[t.getDay()] + "</b><span>" + md(t) + " · 第 " + wk + " 周</span>" +
         '<span class="rest">' + (list.length + evs.length) + " 项</span></div>";
    const merged = list.map(c => ({t:toDate(span(c).s, t), html:cardHTML(c, t)}))
      .concat(evs.map(ev => ({t:toDate(evTime(ev).s, t), html:evCardHTML(ev, t)})))
      .sort((a,b) => a.t - b.t);
    merged.forEach(x => h += x.html);
  }
  if (!STANDALONE){
    h += '<div class="banner"><b>装到桌面更快</b><br>点下方「分享」→「添加到主屏幕」，以后一点就开，没网也能看。</div>';
  }
  document.getElementById("grid").style.display = "none";
  document.getElementById("strip").style.display = "none";
  document.getElementById("page").innerHTML = '<div class="page">' + h + "</div>";
}

/* ============ 全部课程 ============ */
function renderAll(){
  const sorted = COURSES.slice().sort((a,b) => a.d - b.d || a.p - b.p);
  let h = '<div class="sec">共 ' + COURSES.length + " 个时段 · 周日无课</div>";
  sorted.forEach(function(c){
    const sp = span(c), und = c.room.indexOf("待定") >= 0;
    h += '<div class="item" style="--c:' + c.c + '"><span class="sw"></span>' +
      '<div style="flex:1;min-width:0"><div class="n">' + esc(c.n) + '</div>' +
      '<div class="sub">' + DAYN[c.d] + " " + sp.s + "–" + sp.e + "（" + sp.p + " 节） · " +
      '<span style="color:' + (und ? "#ffa14a" : "var(--ink2)") + '">' + esc(c.room) + "</span><br>" +
      "<em>" + esc(c.t) + " · " + weeksText(c) + "</em></div></div></div>";
  });

  h += '<div class="sec">我的日程' + (EVENTS.length ? "（" + EVENTS.length + "）" : "") + "</div>";
  if (!EVENTS.length){
    h += '<div class="empty" style="padding:16px">还没有自定义日程<br>点右上角「＋」可以添加</div>';
  } else {
    EVENTS.slice().sort((a,b) => a.d - b.d || a.from - b.from).forEach(function(ev){
      const et = evTime(ev);
      h += '<div class="item" style="--c:var(--warn)"><span class="sw"></span>' +
        '<div style="flex:1;min-width:0"><div class="n">' + esc(ev.n) + '</div>' +
        '<div class="sub">' + DAYN[ev.d] + " " + et.s + "–" + et.e + "（" + et.p + " 节）" +
        (ev.room ? " · " + esc(ev.room) : "") + "<br><em>" +
        (ev.repeat === "weekly" ? "每周重复" : "仅第 " + ev.week + " 周") + "</em></div></div>" +
        '<button class="del" data-del="' + ev.id + '">删除</button></div>';
    });
  }

  h += '<div class="sec">说明</div><div class="item"><div style="font-size:11.5px;color:var(--ink3);line-height:1.8">' +
       "军事技能（军训）第 5–8 周，期间常规课暂停；<br>" +
       "「地点待定」的体育、基础化学实验以教务通知为准；<br>" +
       "自定义日程保存在本机浏览器，换设备不会同步。</div></div>";
  document.getElementById("grid").style.display = "none";
  document.getElementById("strip").style.display = "none";
  document.getElementById("page").innerHTML = '<div class="page">' + h + "</div>";

  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function(b){
    b.onclick = function(){
      EVENTS = EVENTS.filter(function(x){ return x.id !== b.dataset.del; });
      saveEvents(); renderAll();
    };
  });
}

/* ============ 弹层 ============ */
const sheetwrap = document.getElementById("sheetwrap");
const sheet = document.getElementById("sheet");
function closeSheet(){ sheetwrap.classList.remove("on"); }

function openDetail(id){
  const it = window.__blocks[id];
  if (!it) return;
  if (it.kind === "course"){
    const c = it.c, d = it.d, sp = it.sp;
    sheet.innerHTML = "<h3>" + esc(c.n) + "</h3>" +
      '<div class="sroom">' + ICON_PIN + esc(c.room) + "</div>" +
      "<dl><dt>课程</dt><dd>" + esc(c.full) + "</dd>" +
      "<dt>教师</dt><dd>" + esc(c.t) + "</dd>" +
      "<dt>时间</dt><dd>" + DAYN[d.getDay()] + " " + sp.s + "–" + sp.e + "（第 " + sp.p + " 节）<br>" + md(d) + "</dd>" +
      "<dt>周次</dt><dd>" + weeksText(c) + "</dd></dl>" +
      '<button id="sheetclose">关闭</button>';
  } else {
    const ev = it.ev, d = it.d;
    sheet.innerHTML = "<h3>" + esc(ev.n) + "</h3>" +
      (ev.room ? '<div class="sroom" style="color:var(--warn)">' + ICON_PIN + esc(ev.room) + "</div>" : "") +
      "<dl><dt>类型</dt><dd>自定义日程</dd>" +
      "<dt>时间</dt><dd>" + DAYN[d.getDay()] + " " + it.sp.s + "–" + it.sp.e + "（第 " + it.sp.p + " 节）<br>" + md(d) + "</dd>" +
      "<dt>重复</dt><dd>" + (ev.repeat === "weekly" ? "每周" : "仅第 " + ev.week + " 周") + "</dd></dl>" +
      '<button id="sheetclose">关闭</button>' +
      '<button class="warn" id="evdel">删除这个日程</button>';
    document.getElementById("evdel").onclick = function(){
      EVENTS = EVENTS.filter(function(x){ return x.id !== ev.id; });
      saveEvents(); closeSheet(); render();
    };
  }
  sheetwrap.classList.add("on");
  document.getElementById("sheetclose").onclick = closeSheet;
}
function openAdd(){
  SEL_DAY = new Date().getDay() || 7;
  SEL_FROM = 1; SEL_TO = 2; SEL_REP = "once";
  const dayBtns = DAYN.slice(1).concat(["周日"]).map(function(n, i){
    const d = i + 1;
    return '<button data-day="' + d + '"' + (d === SEL_DAY ? ' class="on"' : "") + ">" + n + "</button>";
  }).join("");
  const opts = function(sel){
    let s = "";
    for (let i=1;i<=10;i++) s += '<option value="' + i + '"' + (i === sel ? " selected" : "") + ">第 " + i + " 节</option>";
    return s;
  };
  sheet.innerHTML =
    "<h3>添加日程</h3>" +
    '<div class="fld"><label>名称</label><input id="evname" maxlength="16" placeholder="如：社团例会"></div>' +
    '<div class="fld"><label>星期</label><div class="chips" id="evdays">' + dayBtns + "</div></div>" +
    '<div class="fld"><label>时间</label><div class="selrow">' +
      '<select id="evfrom">' + opts(SEL_FROM) + "</select><span>到</span>" +
      '<select id="evto">' + opts(SEL_TO) + "</select></div></div>" +
    '<div class="fld"><label>地点（可不填）</label><input id="evroom" maxlength="14" placeholder="如：图书馆 3 楼"></div>' +
    '<div class="fld"><label>重复</label><div class="chips" id="evrep">' +
      '<button data-rep="once" class="on">仅第 ' + WK + ' 周</button><button data-rep="weekly">每周</button></div></div>' +
    '<div class="hint2" id="evhint"></div>' +
    '<div style="height:16px"></div>' +
    '<button id="evsave">保存</button>' +
    '<button class="warn" id="evcancel">取消</button>';

  sheetwrap.classList.add("on");

  Array.prototype.forEach.call(document.querySelectorAll("#evdays button"), function(b){
    b.onclick = function(){
      SEL_DAY = +b.dataset.day;
      Array.prototype.forEach.call(document.querySelectorAll("#evdays button"), function(x){
        x.classList.toggle("on", x === b);
      });
      checkClash();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#evrep button"), function(b){
    b.onclick = function(){
      SEL_REP = b.dataset.rep;
      Array.prototype.forEach.call(document.querySelectorAll("#evrep button"), function(x){
        x.classList.toggle("on", x === b);
      });
    };
  });
  document.getElementById("evfrom").onchange = function(){ SEL_FROM = +this.value; if (SEL_TO < SEL_FROM){ SEL_TO = SEL_FROM; document.getElementById("evto").value = SEL_TO; } checkClash(); };
  document.getElementById("evto").onchange = function(){ SEL_TO = +this.value; checkClash(); };

  function checkClash(){
    const mon = weekMonday(WK);
    const d = new Date(mon); d.setDate(mon.getDate() + (SEL_DAY % 7));
    const hit = coursesOn(d).some(function(c){
      const cs = c.p*2+1, ce = cs + 2*(c.span||1) - 1;
      return !(SEL_TO < cs || SEL_FROM > ce);
    });
    const el = document.getElementById("evhint");
    el.textContent = hit ? "这个时段已有课，日程会显示在课程上方" : "";
    el.classList.toggle("on", hit);
  }
  checkClash();

  document.getElementById("evcancel").onclick = closeSheet;
  document.getElementById("evsave").onclick = function(){
    const n = (document.getElementById("evname").value || "").trim();
    if (!n){ document.getElementById("evname").focus(); return; }
    const from = +document.getElementById("evfrom").value;
    const to = +document.getElementById("evto").value;
    EVENTS.push({
      id: "e" + Date.now() + Math.floor(Math.random()*1000),
      n: n, d: SEL_DAY, from: Math.min(from,to), to: Math.max(from,to),
      room: (document.getElementById("evroom").value || "").trim(),
      repeat: SEL_REP, week: WK
    });
    saveEvents(); closeSheet(); render();
  };
}

sheetwrap.addEventListener("click", function(e){ if (e.target === sheetwrap) closeSheet(); });

/* 点击网格 */
document.getElementById("grid").addEventListener("click", function(e){
  const b = e.target.closest(".blk");
  if (b) openDetail(b.dataset.id);
});

/* ============ 翻周：按钮 + 滑动 + 键盘 ============ */
function changeWeek(dir){
  const n = WK + dir;
  if (n < 1 || n > SEM_WEEKS) return;
  WK = n;
  render();
  const g = document.getElementById("grid");
  if (g){
    g.classList.remove("anim-l", "anim-r");
    void g.offsetWidth;
    g.classList.add(dir > 0 ? "anim-l" : "anim-r");
  }
}
document.getElementById("pw").onclick = function(){ changeWeek(-1); };
document.getElementById("nw").onclick = function(){ changeWeek(1); };
document.getElementById("btnadd").onclick = openAdd;

let tx0 = 0, ty0 = 0, tt0 = 0;
function bindSwipe(el){
  el.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; tt0 = Date.now();
  }, {passive:true});
  el.addEventListener("touchend", function(e){
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - tx0;
    const dy = e.changedTouches[0].clientY - ty0;
    if (Date.now() - tt0 < 700 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6){
      changeWeek(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
}
bindSwipe(document.getElementById("grid"));
bindSwipe(document.getElementById("strip"));
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft") changeWeek(-1);
  if (e.key === "ArrowRight") changeWeek(1);
});

/* ============ 调度 ============ */
function render(){
  renderHead();
  if (TAB === "grid") renderGrid();
  else if (TAB === "today") renderToday();
  else renderAll();
}
Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
  b.onclick = function(){
    TAB = b.dataset.tab;
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(x){
      x.classList.toggle("on", x === b);
    });
    if (TAB === "grid") WK = weekOf(today());
    render();
    window.scrollTo(0,0);
  };
});

render();
setInterval(function(){ if (TAB === "grid" || TAB === "today") render(); }, 60000);

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
